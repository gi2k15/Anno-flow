<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Building Optimizer</title>
  <style>
    :root {
      --bg: #0b1118;
      --panel: #151f2b;
      --panel-2: #1e2a39;
      --text: #e8eef7;
      --muted: #9fb0c6;
      --accent: #2ec4b6;
      --danger: #ef476f;
      --border: #2b3a4d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #1a2431 0%, transparent 35%),
        radial-gradient(circle at 90% 80%, #142a2d 0%, transparent 30%),
        var(--bg);
      color: var(--text);
      padding: 28px 16px;
    }

    .app {
      max-width: 920px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.12);
    }

    #components {
      display: grid;
      gap: 12px;
    }

    .card {
      background: linear-gradient(145deg, var(--panel), #101923);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 220px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      background: #0d1520;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 9px;
      padding: 9px 10px;
      font-size: 0.95rem;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-top: 6px;
    }

    .radio-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #0f1824;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.9rem;
    }

    .remove-btn {
      background: #29131b;
      border-color: #643040;
      color: #ffc8d4;
      margin-left: auto;
    }

    .summary {
      margin-top: 20px;
      background: linear-gradient(145deg, #13202c, #0d1822);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }

    .summary h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
    }

    .summary ul {
      margin: 0;
      padding-left: 18px;
    }

    .summary li {
      margin: 5px 0;
    }

    .empty {
      color: var(--muted);
      margin: 0;
    }

    .hint {
      color: var(--accent);
      font-size: 0.9rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Flow Building Optimizer</h1>
    <p class="subtitle">
      Add your buildings, choose cycle times, and get the recommended quantity of each building for balanced flow.
    </p>

    <div class="controls">
      <button id="addComponentBtn" type="button">+ Add Building Component</button>
    </div>

    <section id="components" aria-label="Building components"></section>

    <section class="summary" aria-live="polite">
      <h2>Optimization Result</h2>
      <div id="summaryContent"></div>
      <p class="hint">Formula used: recommended copies = cycle time / GCD(all cycle times).</p>
    </section>
  </main>

  <template id="componentTemplate">
    <article class="card component">
      <div class="row">
        <div class="field">
          <label>Building Name</label>
          <input type="text" class="building-name" placeholder="e.g. Smelter" />
        </div>
        <button type="button" class="remove-btn">Remove</button>
      </div>

      <div class="field">
        <label>Cycle Time</label>
        <div class="radio-group">
          <label class="radio-chip"><input type="radio" value="30" checked /> 30s</label>
          <label class="radio-chip"><input type="radio" value="60" /> 60s</label>
          <label class="radio-chip"><input type="radio" value="90" /> 90s</label>
          <label class="radio-chip"><input type="radio" value="120" /> 120s</label>
          <label class="radio-chip">
            <input type="radio" value="custom" />
            Custom
          </label>
        </div>
      </div>

      <div class="field custom-field" style="display:none;">
        <label>Custom Time (seconds)</label>
        <input type="number" class="custom-seconds" min="1" step="1" placeholder="Enter seconds" />
      </div>
    </article>
  </template>

  <script>
    const componentsEl = document.getElementById("components");
    const summaryContentEl = document.getElementById("summaryContent");
    const template = document.getElementById("componentTemplate");
    const addButton = document.getElementById("addComponentBtn");
    let componentId = 0;

    function gcd(a, b) {
      while (b !== 0) {
        const t = b;
        b = a % b;
        a = t;
      }
      return a;
    }

    function gcdArray(values) {
      return values.reduce((acc, val) => gcd(acc, val));
    }

    function getSeconds(component) {
      const selected = component.querySelector('input[type="radio"]:checked');
      if (!selected) return null;
      if (selected.value !== "custom") return parseInt(selected.value, 10);
      const customVal = parseInt(component.querySelector(".custom-seconds").value, 10);
      return Number.isInteger(customVal) && customVal > 0 ? customVal : null;
    }

    function recalc() {
      const components = [...componentsEl.querySelectorAll(".component")];
      const validEntries = [];

      for (const component of components) {
        const name = component.querySelector(".building-name").value.trim();
        const seconds = getSeconds(component);
        if (name && seconds) {
          validEntries.push({ name, seconds });
        }
      }

      if (!validEntries.length) {
        summaryContentEl.innerHTML = '<p class="empty">Add at least one valid building to see results.</p>';
        return;
      }

      const globalGcd = gcdArray(validEntries.map((item) => item.seconds));
      const totalsByName = {};
      for (const item of validEntries) {
        const recommended = item.seconds / globalGcd;
        totalsByName[item.name] = (totalsByName[item.name] || 0) + recommended;
      }

      const sorted = Object.entries(totalsByName).sort((a, b) => a[0].localeCompare(b[0]));
      const list = sorted.map(([name, qty]) => `<li><strong>${name}</strong>: add <strong>${qty}</strong></li>`).join("");
      summaryContentEl.innerHTML = `<ul>${list}</ul>`;
    }

    function wireComponent(component) {
      componentId += 1;
      const radios = component.querySelectorAll('input[type="radio"]');
      const customField = component.querySelector(".custom-field");
      const customInput = component.querySelector(".custom-seconds");
      const removeBtn = component.querySelector(".remove-btn");

      radios.forEach((radio) => {
        radio.name = `cycle-time-${componentId}`;
        radio.addEventListener("change", () => {
          const customSelected = component.querySelector('input[type="radio"][value="custom"]').checked;
          customField.style.display = customSelected ? "block" : "none";
          recalc();
        });
      });

      component.querySelector(".building-name").addEventListener("input", recalc);
      customInput.addEventListener("input", recalc);
      removeBtn.addEventListener("click", () => {
        component.remove();
        recalc();
      });
    }

    function addComponent() {
      const fragment = template.content.cloneNode(true);
      const component = fragment.querySelector(".component");
      wireComponent(component);
      componentsEl.appendChild(fragment);
      recalc();
    }

    addButton.addEventListener("click", addComponent);
    addComponent();
  </script>
</body>
</html>
